name: 贡献日历

# 每天自动更新 3D 贡献日历 github-metrics.svg，也可手动触发
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contributions:
    runs-on: ubuntu-latest
    steps:
      # 用 lowlighter/metrics 的 isocalendar 插件生成等轴测 3D 贡献日历
      # 注：原 jasonlong/isometric-contributions 已转型为浏览器扩展，GitHub Action 已不可用，故改用此替代方案
      - name: 生成 3D 贡献日历
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: mousebomb
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year